<!doctype html>
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  width: 440px; height: 280px; overflow: hidden;
  font-family: "Inter", ui-sans-serif, -apple-system, system-ui, sans-serif;
  background: radial-gradient(340px 280px at 70% 30%, #ede9fe 0%, #fafafa 60%, #fafafa 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 0 28px;
}
.brand-mark {
  width: 56px; height: 56px; border-radius: 14px; background: #7c3aed;
  display: grid; place-items: center; box-shadow: 0 6px 14px rgba(124,58,237,.28);
  margin-bottom: 16px;
}
h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #0f172a; margin: 0 0 8px; }
p { font-size: 14px; line-height: 1.4; color: #475569; margin: 0; max-width: 34ch; }
p span { color: #7c3aed; font-weight: 600; }
</style></head>
