name: Publish to Chrome Web Store

# Fires only on a version tag (e.g. v5.2.0) — not on every push to main.
# Tagging every commit isn't useful here since each submission enters
# Google's review queue; a tag is the deliberate "this is a release" signal.
on:
  push:
    tags:
      - "v*"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run zip

      # Uploads a new draft version to the existing store item and stops
      # there — it does NOT call the publish endpoint. Someone still has
      # to open the dashboard and click "Submit for review" by hand. That
      # was the deliberate choice: a broken build can never silently go
      # live with nobody in the loop.
      - name: Upload draft to Chrome Web Store
        run: |
          ZIP=$(ls store-assets/*.zip | head -1)
          npx chrome-webstore-upload-cli upload \
            --source "$ZIP" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"
        env:
          EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
