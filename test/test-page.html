<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Chat Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #fafafa; color: #222; }
    h1 { font-size: 18px; }
    .chat { background: white; border: 1px solid #eaeaea; border-radius: 8px; padding: 16px; min-height: 200px; margin-bottom: 16px; }
    .msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; max-width: 80%; }
    .user { background: #dbeafe; margin-left: auto; }
    .ai { background: #f3f4f6; }
    .input-row { display: flex; gap: 8px; }
    #prompt { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; resize: vertical; min-height: 44px; font-family: inherit; }
    #send { padding: 10px 20px; background: #2563eb; color: white; border: 0; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #send:hover { background: #1d4ed8; }
    #log { margin-top: 16px; padding: 12px; background: #1f2937; color: #d1d5db; border-radius: 6px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Test Chat Page</h1>
  <p>This page mimics an AI chat interface. Use it to test the AI Auto-Sender extension:
    <strong>Teach input</strong> on the textarea below, <strong>Teach send</strong> on the Send button,
    then schedule a message and confirm it fires.</p>

  <div class="chat" id="chat">
    <div class="msg ai">Hello! I'm a test chat. Type a message below and click Send.</div>
  </div>

  <div class="input-row">
    <textarea id="prompt" placeholder="Type your prompt…"></textarea>
    <button id="send" type="submit">Send</button>
  </div>

  <div id="log"></div>

  <script>
    const chat = document.getElementById("chat");
    const prompt = document.getElementById("prompt");
    const send = document.getElementById("send");
    const log = document.getElementById("log");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
    }

    function appendLog(text) {
      const t = new Date().toLocaleTimeString();
      log.textContent = "[" + t + "] " + text + "\n" + log.textContent;
    }

    function handleSend() {
      const text = prompt.value.trim();
      if (!text) return;
      addMsg(text, "user");
      appendLog("Sent: " + text);
      prompt.value = "";
      // Simulate AI response
      setTimeout(() => {
        addMsg("Echo: " + text, "ai");
        appendLog("Response: Echo: " + text);
      }, 800);
    }

    send.addEventListener("click", handleSend);
    prompt.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
